[platformio]
; =========================================================================
; Active Display Selection:
; Uncomment the environment for the screen you are currently working with:
; =========================================================================
default_envs = ATtiny402_128x64
; default_envs = ATtiny402_128x32

[env]
platform = atmelmegaavr
board = ATtiny402
framework = arduino

; megaTinyCore platform package
platform_packages =
    framework-arduino-megaavr-megatinycore @ https://github.com/SpenceKonde/megaTinyCore.git

; 20 MHz internal oscillator
board_build.f_cpu = 20000000L

; Hyper-optimization compiler flags: size optimization, function/data sections, LTO
build_flags =
    -Wall
    -Wextra
    -Os
    -flto
    -mrelax
    -ffunction-sections
    -fdata-sections

; =========================================================================
; 1. SerialUPDI Upload (FTDI / CH340 / CP2102 + diode/resistor to PA0 / UPDI)
; =========================================================================

; --- 128x64 OLED Display (Standard) ---
[env:ATtiny402_128x64]
build_flags =
    ${env.build_flags}
    -D SSD1306_HEIGHT=64
upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_flags =
    -b
    115200

; Backward-compatible alias for 128x64
[env:ATtiny402]
extends = env:ATtiny402_128x64

; --- 128x32 OLED Display (12832 Variant) ---
[env:ATtiny402_128x32]
build_flags =
    ${env.build_flags}
    -D SSD1306_HEIGHT=32
upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_flags =
    -b
    115200

; =========================================================================
; 2. Microchip MPLAB PICkit 4 / PICkit 5 Upload (Direct UPDI via Avrdude)
; =========================================================================

; 128x64 OLED with PICkit
[env:ATtiny402_128x64_pickit5]
build_flags =
    ${env.build_flags}
    -D SSD1306_HEIGHT=64
upload_protocol = pickit5_updi

[env:ATtiny402_pickit5]
extends = env:ATtiny402_128x64_pickit5

; 128x32 OLED with PICkit
[env:ATtiny402_128x32_pickit5]
build_flags =
    ${env.build_flags}
    -D SSD1306_HEIGHT=32
upload_protocol = pickit5_updi
